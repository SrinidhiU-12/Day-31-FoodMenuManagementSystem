
<div class="form-container">
  <h2>{{ id ? 'Edit Food Item' : 'Add Food Item' }}</h2>

  <form (ngSubmit)="onSubmit()" #foodForm="ngForm">

    <label>Food Name</label>
    <input
      type="text"
      name="name"
      [(ngModel)]="name"
      required
      maxlength="100">

    <label>Description</label>
    <textarea
      name="description"
      [(ngModel)]="description"
      maxlength="500">
    </textarea>

    <label>Price (₹)</label>
    <input
      type="number"
      name="price"
      [(ngModel)]="price"
      required
      min="0.01"
      step="0.01">

    <label>Image URL</label>
    <input
      type="url"
      name="imageUrl"
      [(ngModel)]="imageUrl">

    <label>Category</label>
    <select
      name="categoryId"
      [(ngModel)]="categoryId"
      required>
      <option [ngValue]="null" disabled>Select Category</option>

      @for (category of categories; track category.id) {
        <option [ngValue]="category.id">
          {{ category.name }}
        </option>
      }
    </select>

    @if (id !== null) {
      <label class="availability">
        <input
          type="checkbox"
          name="isAvailable"
          [(ngModel)]="isAvailable">
        Available
      </label>
    }

    <button type="submit" [disabled]="foodForm.invalid">
      {{ id ? 'Update Food Item' : 'Create Food Item' }}
    </button>

    <a routerLink="/food-items">Cancel</a>
  </form>

  @if (message) {
    <p class="message">{{ message }}</p>
  }
</div>
